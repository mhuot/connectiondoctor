# Reusable build: the dashboard once, then both collectors with that bundle
# staged in. Called by ci.yml (unsigned, no publish) and release.yml (signs and
# notarizes when secrets exist). See docs/distribution.md.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version without the leading v (e.g. 0.1.0). Dev builds pass 0.0.0-dev.
        type: string
        default: 0.0.0-dev
      release:
        description: Sign, notarize and produce release-named artifacts.
        type: boolean
        default: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - name: Set the bundle version from the tag
        run: |
          npm version --no-git-tag-version "${{ inputs.version }}"
          got="$(node -p "require('./package.json').version")"
          [ "$got" = "${{ inputs.version }}" ] || { echo "package.json version is '$got', expected '${{ inputs.version }}'" >&2; exit 1; }
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dashboard-dist, path: dashboard/dist, if-no-files-found: error }

  macos:
    needs: dashboard
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dashboard-dist, path: macos/Sources/TBDoctor/ui }
      - name: Import Developer ID certificate
        id: cert
        if: inputs.release
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "signing skipped: secret DEVELOPER_ID_CERT_P12 not set" >> "$GITHUB_STEP_SUMMARY"
            echo "have=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "have=true" >> "$GITHUB_OUTPUT"
      - name: Test TBDoctor
        working-directory: macos
        run: swift test
      - name: Build TBDoctor.app
        working-directory: macos
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.have == 'true' && vars.DEVELOPER_ID_IDENTITY || '' }}
        run: ./build_app.sh release
      - name: Assert architecture matches docs/distribution.md
        working-directory: macos
        run: |
          archs="$(lipo -archs TBDoctor.app/Contents/MacOS/TBDoctor)"
          echo "TBDoctor architectures: $archs"
          [ "$archs" = "arm64" ] || { echo "expected arm64 only, got '$archs' — update docs/distribution.md and release-pipeline/design.md together" >&2; exit 1; }
      - name: Notarize and staple
        if: steps.cert.outputs.have == 'true'
        working-directory: macos
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          if [ -z "$AC_API_KEY_P8" ]; then
            echo "notarization skipped: secret AC_API_KEY_P8 not set" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "$AC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent TBDoctor.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple TBDoctor.app
      - name: Package .dmg and .zip
        working-directory: macos
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.have == 'true' && vars.DEVELOPER_ID_IDENTITY || '' }}
        run: scripts/make-dmg.sh "TBDoctor-${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/TBDoctor-*.dmg
            macos/TBDoctor-*.zip
          if-no-files-found: error

  windows:
    needs: dashboard
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dashboard-dist, path: windows/src/ConnectionDoctor/ui }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test windows/ConnectionDoctor.sln -c Release
      - name: Publish single-file executables
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}" -replace '-dev.*$', ''
          if ($v -eq '0.0.0') { $v = '0.0.0' }
          foreach ($rid in 'win-arm64','win-x64') {
            dotnet publish windows/src/ConnectionDoctor -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$v -p:InformationalVersion="${{ inputs.version }}" `
              -o "artifacts/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "artifacts/$rid/ConnectionDoctor.exe" "artifacts/ConnectionDoctor-${{ inputs.version }}-$rid.exe"
          }
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: windows-unsigned
          path: artifacts/ConnectionDoctor-*.exe
          if-no-files-found: error
      - name: Sign with SignPath
        id: signpath
        if: inputs.release
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            "signing skipped: secret SIGNPATH_API_TOKEN not set" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "have=false" | Out-File -Append $env:GITHUB_OUTPUT
          } else { "have=true" | Out-File -Append $env:GITHUB_OUTPUT }
      - uses: signpath/github-action-submit-signing-request@v1
        if: steps.signpath.outputs.have == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Choose signed or unsigned for release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/final | Out-Null
          if (Test-Path artifacts/signed) { Copy-Item artifacts/signed/*.exe artifacts/final/ }
          else { Copy-Item artifacts/ConnectionDoctor-*.exe artifacts/final/ }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: artifacts/final/*.exe, if-no-files-found: error }
