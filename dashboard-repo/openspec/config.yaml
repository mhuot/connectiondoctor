schema: spec-driven

context: |
  Project: Connection Dashboard — one React UI for the connection-diagnostics
  family (TBDoctor on macOS, ConnectionDoctor on Windows).
  Data source: Connection Contract v1 (connection-contract/v1), specified in
  mhuot/tbdoctor docs/schema-v1.md. Envelope {schema, capturedAt, host, power,
  nodes[], displays[], displaysKnown}; flat nodes with parentId; vidPid as
  cross-platform identity; tunneled only for genuine USB4 tunnels (DP/USB3);
  deficit = externalConnected && batteryRateMilliwatts <= -2000.
  Tech stack: TypeScript, React 18, Vite, vitest. Web-first; a Tauri shell wraps
  the same app later (decision recorded in design.md of add-react-dashboard —
  React Native was evaluated and rejected).
  Fleet: M5 Pro MBP, M3 Pro MBP, M4 Mac mini, Surface Laptop 7; one Surface
  TB4 dock, one CalDigit Element Hub, one LG UltraWide with KVM that moves
  peripherals between hosts. The dashboard's marquee use case is watching
  devices migrate across hosts.
  Conventions: no default exports; pure layout/domain logic separate from
  components so it is unit-testable; every diagnosis surface shows evidence.
